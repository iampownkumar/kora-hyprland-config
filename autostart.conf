#	 AUTO START FILES HERE 

exec-once = waybar   # this is the app bar layout that i wanted 
exec-once = nm-applet & 
exec-once = blueman-applet &  # this is for bluetooth starting point 
exec-once = hyprpm reload -n  # auto-load hyprpm plugins (hyprexpo etc.)
exec-once = hyprctl dispatch workspace 1; $terminal >/dev/null 2>&1