# INPUT FILES

input {
	kb_layout = us
	follow_mouse = 1
	
	touchpad {
		natural_scroll = true
	}
}

############################################
# GESTURES (v0.54.2 native syntax)
############################################

# 3-finger: Horizontal workspace switching (smooth 1:1 tracking)
gesture = 3, horizontal, workspace

# 3-finger: Vertical — workspace overview (hyprexpo)
# NOTE: ELAN1203 touchpad only supports up to 3 fingers,
#       so hyprexpo is mapped to 3-finger vertical instead of 4-finger.
# gesture = 3, up, dispatcher, hyprexpo:expo toggle
# gesture = 3, down, dispatcher, hyprexpo:expo toggle
