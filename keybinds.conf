#############################################################
# HYPRLAND KEYBINDS CONFIG
#
# Author  : Pownkumar
# Role    : Founder of Korelium
# System  : Arch Linux + Hyprland
#
# This file defines all keyboard-driven workflow bindings.
#############################################################


############################################
# APPLICATION LAUNCHERS
############################################

# Terminal
bind = $mainMod, RETURN, exec, $terminal

# Application launcher
bind = $mainMod, D, exec, $menu

# File manager
bind = $mainMod, E, exec, $fileManager

#firefox
bind = $mainMod, F, exec, firefox

#antigravity 
bind = $mainMod, A, exec, antigravity

#vscodium
bind = $mainMod, C, exec, vscodium

############################################
# WINDOW MANAGEMENT
############################################

# Close active window
bind = $mainMod, Q, killactive

# Toggle floating window
bind = $mainMod, SPACE, togglefloating

# Fullscreen window
#bind = $mainMod, F, fullscreen


############################################
# WINDOW FOCUS MOVEMENT (VIM STYLE)
############################################

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d


############################################
# MOVE WINDOWS
############################################

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d


############################################
# WORKSPACES
############################################

# Switch workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9


############################################
# WORKSPACE SCROLL
############################################

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1



############################################
# SYSTEM CONTROLS
############################################

# Reload Hyprland configuration
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Exit Hyprland session
bind = $mainMod SHIFT, Q, exit

# Lock screen (Hyprlock)
bind = $mainMod, L, exec, hyprlock


############################################
# SCREENSHOTS
############################################

# Full screenshot
bind = , Print, exec, bash -c 'DIR="$HOME/Pictures/Screenshot"; mkdir -p "$DIR"; FILE="$DIR/Screenshot-$(date +%F_%H-%M-%S).png"; grim "$FILE" && wl-copy < "$FILE" && notify-send -t 800 "Screenshot saved & copied"'

# Area screenshot
bind = SHIFT, Print, exec, bash -c 'DIR="$HOME/Pictures/Screenshot"; mkdir -p "$DIR"; FILE="$DIR/Screenshot-$(date +%F_%H-%M-%S).png"; grim -g "$(slurp)" "$FILE" && wl-copy < "$FILE" && notify-send -t 800 "Screenshot saved & copied"'


############################################
# BRIGHTNESS CONTROLS
############################################

bind = , F7, exec, brightnessctl set 10%-
bind = , F8, exec, brightnessctl set 10%+


############################################
# AUDIO CONTROLS
############################################
bind = , F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bind = , F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

# Fullscreen window
bind = , F9, fullscreen

# Tab cycling effect
bind = ALT , Tab , cyclenext
